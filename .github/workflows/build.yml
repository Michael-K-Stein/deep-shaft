name: build

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: deep-shaft-pit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the Connect IQ SDK
        uses: actions/cache@v4
        with:
          path: deep-shaft-pit/build/sdk
          key: connectiq-sdk-${{ hashFiles('deep-shaft-pit/tools/build.sh') }}

      - name: Check the round-screen layout
        run: python3 tools/check_layout.py

      - name: Build for the Venu 2 family
        run: tools/build.sh --fetch-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: deep-shaft-pit-prg
          path: deep-shaft-pit/build/*.prg
          if-no-files-found: error
