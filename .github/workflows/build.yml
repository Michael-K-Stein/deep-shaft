name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [deep-shaft-tycoon, deep-shaft-pit]

    defaults:
      run:
        working-directory: ${{ matrix.game }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the Connect IQ SDK
        uses: actions/cache@v4
        with:
          path: ${{ matrix.game }}/build/sdk
          key: connectiq-sdk-${{ hashFiles(format('{0}/tools/build.sh', matrix.game)) }}

      - name: Build for the Venu 2 family
        run: tools/build.sh --fetch-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-prg
          path: ${{ matrix.game }}/build/*.prg
          if-no-files-found: error
